name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Build Docs
        run: yarn docs:build

  e2e:
    name: E2E (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transport: [plaintext, secure]
    env:
      COMPOSE_PROJECT_NAME: gateway-e2e-${{ matrix.transport }}
      E2E_SECURE: ${{ matrix.transport == 'secure' && 'true' || 'false' }}
      E2E_ARTIFACTS_DIR: e2e-artifacts
      RTPBRIDGE_IMAGE: rtc-session-gateway-rtpbridge-e2e:ci
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v7.0.0

      - name: Checkout Latest rtpbridge
        uses: actions/checkout@v7.0.0
        with:
          repository: zyno-io/rtpbridge
          ref: main
          path: .e2e/rtpbridge

      - name: Record Backend Revision
        id: backend
        run: |
          revision=$(git -C .e2e/rtpbridge rev-parse HEAD)
          echo "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          mkdir -p e2e-artifacts
          echo "$revision" > e2e-artifacts/backend-revision.txt

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Latest rtpbridge
        uses: docker/build-push-action@v7.2.0
        with:
          context: .e2e/rtpbridge
          load: true
          tags: rtc-session-gateway-rtpbridge-e2e:ci
          build-args: BUILD_VERSION=e2e
          labels: org.opencontainers.image.revision=${{ steps.backend.outputs.revision }}
          cache-from: type=gha,scope=rtpbridge-e2e
          cache-to: type=gha,mode=max,scope=rtpbridge-e2e

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Run Full Stack E2E
        shell: bash
        run: |
          mkdir -p e2e-artifacts
          set -o pipefail
          yarn e2e:compose 2>&1 | tee e2e-artifacts/runner.log

      - name: Upload E2E Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.transport }}
          path: e2e-artifacts
          if-no-files-found: warn

      - name: Remove E2E Stack
        if: always()
        run: E2E_FIXTURES_DIR=. docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  image:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log In To GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Publish Image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ghcr.io/zyno-io/rtc-session-gateway:main
          labels: |
            org.opencontainers.image.source=https://github.com/zyno-io/rtc-session-gateway
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=0.0.0-main
