name: Release Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Validate Release
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: checks
    concurrency:
      group: rtc-session-gateway-release-images
      queue: max
    env:
      GATEWAY_IMAGE: ghcr.io/zyno-io/rtc-session-gateway
      FIREWALL_IMAGE: ghcr.io/zyno-io/rtc-session-gateway-firewall-sidecar
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log In To GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag

      - name: Build And Publish Gateway
        id: gateway
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:${{ env.RELEASE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}

      - name: Build And Publish Firewall Sidecar
        id: firewall
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: firewall-sidecar/Dockerfile
          target: firewall-sidecar
          push: true
          tags: ${{ env.FIREWALL_IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/zyno-io/rtc-session-gateway
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Promote Latest Stable Release
        shell: bash
        env:
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          FIREWALL_DIGEST: ${{ steps.firewall.outputs.digest }}
        run: |
          latest=$(git ls-remote --tags --refs --sort=-version:refname origin 'refs/tags/v*' |
            awk '$2 ~ /^refs\/tags\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found++ { sub("^refs/tags/", "", $2); print $2 }')
          if [[ "$RELEASE_TAG" != "$latest" ]]; then
            echo "This tag is outside the latest stable release. Keeping its release tags."
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false --tag "$GATEWAY_IMAGE:latest" "$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$FIREWALL_IMAGE:latest" "$FIREWALL_IMAGE@$FIREWALL_DIGEST"
