services:
  rtpbridge:
    image: ${RTPBRIDGE_IMAGE:-ghcr.io/zyno-io/rtpbridge:main}
    command:
      - --config
      - /etc/rtpbridge/rtpbridge.e2e.toml
      - --listen
      - 0.0.0.0:9100
      - --media-ip
      - 10.89.42.10
    ports:
      - 9100:9100/tcp
    volumes:
      - ${E2E_FIXTURES_DIR:-./scripts}:/etc/rtpbridge:ro
      - rtpbridge-recordings:/var/lib/rtpbridge/recordings
    networks:
      default:
        ipv4_address: 10.89.42.10
        aliases:
          - rtpbridge-e2e
  rtpbridge-b:
    image: ${RTPBRIDGE_IMAGE:-ghcr.io/zyno-io/rtpbridge:main}
    command:
      - --config
      - /etc/rtpbridge/rtpbridge.e2e.toml
      - --listen
      - 0.0.0.0:9101
      - --media-ip
      - 10.89.42.11
    ports:
      - 9101:9101/tcp
    volumes:
      - ${E2E_FIXTURES_DIR:-./scripts}:/etc/rtpbridge:ro
      - rtpbridge-recordings-b:/var/lib/rtpbridge/recordings
    networks:
      default:
        ipv4_address: 10.89.42.11
        aliases:
          - rtpbridge-e2e
  turn:
    build: &id001
      context: .
      target: e2e
    network_mode: service:rtpbridge
    depends_on:
      - rtpbridge
    command: &id002
      - turnserver
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=e2e-turn-secret
      - --realm=e2e
      - --relay-threads=1
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
  turn-b:
    build: *id001
    network_mode: service:rtpbridge-b
    depends_on:
      - rtpbridge-b
    command: *id002
  gateway:
    stop_grace_period: 15s
    build:
      context: .
      target: e2e
    depends_on:
      - rtpbridge
      - rtpbridge-b
      - turn
      - turn-b
      - sipbridge
    environment:
      SHUTDOWN_MAX_WAIT_MS: ${E2E_SHUTDOWN_MAX_WAIT_MS:-10000}
      SHUTDOWN_CLEANUP_TIMEOUT_MS: '3000'
      HTTP_PORT: '3001'
      CONTROL_AUTH_MODE: none
      RTPBRIDGE_HOST: rtpbridge-e2e
      RTPBRIDGE_ENDPOINTS_ALLOW_PLAINTEXT: ${E2E_ALLOW_PLAINTEXT:-false}
      RTPBRIDGE_REQUIRED: 'true'
      RTPBRIDGE_PORT: '9100'
      RTPBRIDGE_TLS: ${E2E_SECURE:-false}
      RTPBRIDGE_AUTH_HMAC_SECRET_FILE: ${E2E_CONTAINER_SECRET_FILE:-}
      RTPBRIDGE_TLS_CA_FILE: ${E2E_CONTAINER_CA_FILE:-}
      RTPBRIDGE_TLS_SERVERNAME: unused-global-name.test
      COTURN_AUTH_SECRET: e2e-turn-secret
      RECORDINGS_PATH: /var/lib/rtpbridge/recordings
      E2E_AUDIO_HOST: gateway
      E2E_AUDIO_PORT: '18080'
      ROUTES_JSON: '[]'
      RTC_ENDPOINTS_FILE: /etc/rtpbridge/endpoints.json
      SIPBRIDGE_TLS_CERT_FILE: /etc/rtpbridge/native-client.crt
      SIPBRIDGE_TLS_KEY_FILE: /etc/rtpbridge/native-client.key
      SIPBRIDGE_TLS_CA_FILE: /etc/rtpbridge/native-ca.crt
      ROUTES_REQUIRED: 'true'
    ports:
      - ${E2E_GATEWAY_PORT:-3001}:3001/tcp
    volumes:
      - ${E2E_FIXTURES_DIR:-./scripts}:/etc/rtpbridge:ro
    networks:
      default:
        ipv4_address: 10.89.42.20
  sipbridge:
    image: ${SIPBRIDGE_IMAGE:?Set SIPBRIDGE_IMAGE to the qualified native runtime}
    environment:
      SIPBRIDGE_STATE_BACKEND: memory
    command:
      - --instance
      - sipbridge-e2e
      - --control-listen
      - 0.0.0.0:8443
      - --admin-listen
      - 0.0.0.0:8800
      - --sip-listen
      - 0.0.0.0:5061
      - --sip-plain-listen
      - 0.0.0.0:5060
      - --advertise
      - 10.89.42.30:5061
      - --advertise-plain
      - 10.89.42.30:5060
      - --contact
      - sip:sipbridge@10.89.42.30:5060;transport=tcp
      - --control-cert
      - /fixtures/native-server.crt
      - --control-key
      - /fixtures/native-server.key
      - --sip-cert
      - /fixtures/native-server.crt
      - --sip-key
      - /fixtures/native-server.key
      - --client-ca
      - /fixtures/native-ca.crt
      - --allowed-client-uri
      - spiffe://rtc/e2e/controller
      - --allow-register=false
      - --allow-subscribe=false
    ports:
      - ${E2E_SIP_PORT:-5060}:5060/tcp
      - ${E2E_SIP_PORT:-5060}:5060/udp
      - ${E2E_SIP_ADMIN_PORT:-18800}:8800/tcp
    volumes:
      - ${E2E_FIXTURES_DIR:-./scripts}:/fixtures:ro
    networks:
      default:
        ipv4_address: 10.89.42.30
volumes:
  rtpbridge-recordings: null
  rtpbridge-recordings-b: null
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.42.0/24
